<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ruang Baca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
        }

        .navbar-ruang-baca {
            background-color: #198754;
        }

        .login-card {
            border: none;
            border-radius: 8px;
            overflow: hidden;
        }

        .login-card .card-body {
            padding: 24px;
        }

        .login-title {
            font-size: 1.75rem;
            font-weight: 500;
        }

        .login-subtitle {
            color: #6c757d;
        }

        .form-control {
            padding: 9px 12px;
        }

        .btn-login {
            background-color: #198754;
            border-color: #198754;
            padding: 9px 12px;
        }

        .btn-login:hover {
            background-color: #157347;
            border-color: #146c43;
        }

        .forgot-password {
            color: #198754;
        }

        @media (max-width: 575.98px) {
            .login-card .card-body {
                padding: 20px;
            }

            .login-title {
                font-size: 1.45rem;
            }

            .login-subtitle {
                font-size: 0.95rem;
            }

            main.container {
                padding-top: 2rem !important;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-md navbar-dark navbar-ruang-baca">
        <div class="container-fluid px-3 px-md-4">
            <a class="navbar-brand fw-bold" href="#">Ruang Baca</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#menuRuangBaca"
                    aria-controls="menuRuangBaca" aria-expanded="false"
                    aria-label="Buka navigasi">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuRuangBaca">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link text-white px-md-2" href="#">Beranda</a>
                    <a class="nav-link text-white px-md-2" href="#">Tentang</a>
                    <a class="nav-link text-white px-md-2" href="#">Bantuan</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-5">
                <div class="card login-card shadow">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <h1 class="login-title mb-2">Masuk ke Ruang Baca</h1>
                            <p class="login-subtitle mb-0">Temukan bacaan untuk hari ini.</p>
                        </div>

                        <form>
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username"
                                       name="username" placeholder="Masukkan username">
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password"
                                       name="password" placeholder="Masukkan password">
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label" for="remember">Ingat saya</label>
                            </div>

                            <button type="button" class="btn btn-success btn-login w-100">
                                Masuk
                            </button>
                        </form>
                    </div>

                    <div class="card-footer bg-light text-center py-3">
                        <a href="#" class="forgot-password">Lupa password?</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
